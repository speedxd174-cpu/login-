<script>

/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

/*
   IMPORTANT:

   Replace these two values with your own
   Supabase project information.

   Supabase Dashboard
   → Project Settings
   → API
*/

const SUPABASE_URL =
    "https://rvzguquaznbsuxvytfyz.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_A33Ujai0VrsWOChm3e4vkQ_WXfW15Yt";


/* Create Supabase client */

const {
    createClient
} = supabase;

const db =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   ELEMENTS
===================================================== */

const authSection =
    document.getElementById("authSection");

const registerSection =
    document.getElementById("registerSection");

const userPanel =
    document.getElementById("userPanel");

const toast =
    document.getElementById("toast");


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

    toast.textContent =
        message;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    },3500);
}


/* =====================================================
   LOGIN
===================================================== */

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const email =
            document
            .getElementById("loginEmail")
            .value
            .trim();

        const password =
            document
            .getElementById("loginPassword")
            .value;


        const button =
            document
            .getElementById("loginBtn");

        const text =
            document
            .getElementById("loginText");

        const loader =
            document
            .getElementById("loginLoader");


        text.style.display =
            "none";

        loader.style.display =
            "block";

        button.disabled =
            true;


        try{

            const {
                data,
                error
            } =
            await db.auth
            .signInWithPassword({

                email:
                    email,

                password:
                    password

            });


            if(error)
                throw error;


            showToast(
                "Login successful!"
            );


            await loadUser(
                data.user
            );


        }catch(error){

            showToast(
                error.message
            );

        }finally{

            text.style.display =
                "inline";

            loader.style.display =
                "none";

            button.disabled =
                false;

        }

    }
);


/* =====================================================
   GOOGLE LOGIN
===================================================== */

document
.getElementById("googleBtn")
.addEventListener(
    "click",
    async function(){

        try{

            const {
                error
            } =
            await db.auth
            .signInWithOAuth({

                provider:
                    "google",

                options:{
redirectTo: window.location.origin
                }

            });


            if(error)
                throw error;


        }catch(error){

            showToast(
                error.message
            );

        }

    }
);


/* =====================================================
   CREATE ACCOUNT PAGE
===================================================== */

document
.getElementById("createAccount")
.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        authSection.style.display =
            "none";

        registerSection.style.display =
            "block";

    }
);


/* =====================================================
   BACK TO LOGIN
===================================================== */

document
.getElementById("backToLogin")
.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        registerSection.style.display =
            "none";

        authSection.style.display =
            "block";

    }
);


/* =====================================================
   REGISTER
===================================================== */

document
.getElementById("registerForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const username =
            document
            .getElementById("registerUsername")
            .value
            .trim();

        const email =
            document
            .getElementById("registerEmail")
            .value
            .trim();

        const password =
            document
            .getElementById("registerPassword")
            .value;


        const button =
            document
            .getElementById("registerBtn");

        const text =
            document
            .getElementById("registerText");

        const loader =
            document
            .getElementById("registerLoader");


        text.style.display =
            "none";

        loader.style.display =
            "block";

        button.disabled =
            true;


        try{

            const {
                data,
                error
            } =
            await db.auth
            .signUp({

                email:
                    email,

                password:
                    password,

                options:{

                    data:{

                        username:
                            username

                    }

                }

            });


            if(error)
                throw error;


            /*
              If email confirmation is enabled,
              Supabase may return a user but
              require email verification.
            */

            if(
                data.user &&
                data.session
            ){

                await saveProfile(
                    data.user,
                    username,
                    "email"
                );

                await loadUser(
                    data.user
                );

            }else{

                showToast(
                    "Account created! Check your email to verify your account."
                );

                registerSection.style.display =
                    "none";

                authSection.style.display =
                    "block";

            }


        }catch(error){

            showToast(
                error.message
            );

        }finally{

            text.style.display =
                "inline";

            loader.style.display =
                "none";

            button.disabled =
                false;

        }

    }
);


/* =====================================================
   SAVE PROFILE
===================================================== */

async function saveProfile(
    user,
    username = null,
    provider = "email"
){

    if(!user)
        return;


    const metadata =
        user.user_metadata || {};


    const finalUsername =
        username ||
        metadata.username ||
        metadata.full_name ||
        user.email
        ?.split("@")[0];


    const avatar =
        metadata.avatar_url ||
        metadata.picture ||
        null;


    const {
        error
    } =
    await db
    .from("profiles")
    .upsert({

        id:
            user.id,

        email:
            user.email,

        username:
            finalUsername,

        avatar_url:
            avatar,

        provider:
            provider

    });


    if(error){

        console.error(
            "Profile error:",
            error
        );

    }

}


/* =====================================================
   LOAD USER
===================================================== */

async function loadUser(user){

    if(!user)
        return;


    const metadata =
        user.user_metadata || {};


    const provider =
        user.app_metadata
        ?.provider ||
        "email";


    /*
       Save Google users automatically.
    */

    await saveProfile(
        user,
        null,
        provider
    );


    const username =
        metadata.username ||
        metadata.full_name ||
        metadata.name ||
        user.email
        ?.split("@")[0] ||
        "Player";


    const avatar =
        metadata.avatar_url ||
        metadata.picture ||
        "https://ui-avatars.com/api/?name=" +
        encodeURIComponent(username);


    document
    .getElementById("userName")
    .textContent =
        username;


    document
    .getElementById("userEmail")
    .textContent =
        user.email || "";


    document
    .getElementById("userAvatar")
    .src =
        avatar;


    authSection.style.display =
        "none";

    registerSection.style.display =
        "none";

    userPanel.style.display =
        "block";

}

db.auth.onAuthStateChange(
    async function(
        event,
        session
    ){

        if(session?.user){

            /*
              Small delay prevents
              auth-state race conditions.

            setTimeout(
                async function(){

                    await loadUser(

                    );

                },
                0
            );

async function checkSession(){

        data
    } =
    await db.auth.getSession();


    if(
        data &&
        data.session &&
        data.session.user
    ){

        await loadUser(
            data.session.user
        );

    }

}
