.grid{

    opacity:.18;

}

}

}

@keyframes floatParticle{

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://rvzguquaznbsuxvytfyz.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_A33Ujai0VrsWOChm3e4vkQ_WXfW15Yt";

const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

console.log(
    "NEXORA Supabase initialized."
);


/* =====================================================
   ELEMENTS
===================================================== */

const authSection =
    document.getElementById(
        "authSection"
    );

const registerSection =
    document.getElementById(
        "registerSection"
    );

const userPanel =
    document.getElementById(
        "userPanel"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        4000
    );
}


/* =====================================================
   GOOGLE LOGIN
===================================================== */

document
.getElementById("googleBtn")
.addEventListener(
    "click",
    async function(){

        const button =
            document.getElementById(
                "googleBtn"
            );

        button.disabled =
            true;

        button.innerHTML =
            "Connecting to Google...";


        try{

            /*
             IMPORTANT:

             DO NOT add a Google callback URL here.

             Supabase automatically handles:

             Google
                ↓
             Supabase callback
                ↓
             Your website

             The Google OAuth redirect URI must be
             configured in Google Cloud as:

             https://rvzguquaznbsuxvytfyz.supabase.co/auth/v1/callback
            */

            const {
                error
            } =
            await db.auth.signInWithOAuth({

                provider:
                    "google"

            });


            if(error){

                throw error;

            }

        }
        catch(error){

            console.error(
                "GOOGLE LOGIN ERROR:",
                error
            );

            showToast(
                "Google login error: " +
                error.message
            );

            button.disabled =
                false;

            button.innerHTML =
                '<span class="google-icon">G</span> Continue with Google';
        }

    }
);


/* =====================================================
   EMAIL LOGIN
===================================================== */

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const email =
            document
            .getElementById(
                "loginEmail"
            )
            .value
            .trim();


        const password =
            document
            .getElementById(
                "loginPassword"
            )
            .value;


        const button =
            document.getElementById(
                "loginBtn"
            );

        button.disabled =
            true;


        try{

            const {
                data,
                error
            } =
            await db.auth.signInWithPassword({

                email:
                    email,

                password:
                    password

            });


            if(error){

                throw error;

            }


            showToast(
                "Login successful!"
            );


            await loadUser(
                data.user
            );

        }
        catch(error){

            console.error(
                "EMAIL LOGIN ERROR:",
                error
            );

            showToast(
                error.message
            );

        }
        finally{

            button.disabled =
                false;

        }

    }
);


/* =====================================================
   CREATE ACCOUNT
===================================================== */

document
.getElementById("createAccount")
.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        authSection.style.display =
            "none";

        registerSection.style.display =
            "block";

    }
);


/* =====================================================
   BACK TO LOGIN
===================================================== */

document
.getElementById("backToLogin")
.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        registerSection.style.display =
            "none";

        authSection.style.display =
            "block";

    }
);


/* =====================================================
   REGISTER
===================================================== */

document
.getElementById("registerForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const username =
            document
            .getElementById(
                "registerUsername"
            )
            .value
            .trim();


        const email =
            document
            .getElementById(
                "registerEmail"
            )
            .value
            .trim();


        const password =
            document
            .getElementById(
                "registerPassword"
            )
            .value;


        const button =
            document.getElementById(
                "registerBtn"
            );

        button.disabled =
            true;


        try{

            const {
                data,
                error
            } =
            await db.auth.signUp({

                email:
                    email,

                password:
                    password,

                options:{

                    data:{

                        username:
                            username

                    }

                }

            });


            if(error){

                throw error;

            }


            if(
                data.user &&
                data.session
            ){

                await loadUser(
                    data.user
                );

            }
            else{

                showToast(
                    "Account created! Check your email to verify it."
                );

                registerSection.style.display =
                    "none";

                authSection.style.display =
                    "block";
            }

        }
        catch(error){

            console.error(
                "REGISTER ERROR:",
                error
            );

            showToast(
                error.message
            );

        }
        finally{

            button.disabled =
                false;

        }

    }
);


/* =====================================================
   LOAD USER
===================================================== */

async function loadUser(user){

    if(!user)
        return;


    const metadata =
        user.user_metadata || {};


    const username =
        metadata.username ||
        metadata.full_name ||
        metadata.name ||
        user.email?.split("@")[0] ||
        "Player";


    const avatar =
        metadata.avatar_url ||
        metadata.picture ||
        "https://ui-avatars.com/api/?name=" +
        encodeURIComponent(
            username
        );


    document
    .getElementById(
        "userName"
    )
    .textContent =
        username;


    document
    .getElementById(
        "userEmail"
    )
    .textContent =
        user.email || "";


    document
    .getElementById(
        "userAvatar"
    )
    .src =
        avatar;


    authSection.style.display =
        "none";

    registerSection.style.display =
        "none";

    userPanel.style.display =
        "block";
}

/* =====================================================
   CHECK EXISTING SESSION
===================================================== */

async function checkSession(){

    try{

        const {
            data,
            error
        } =
        await db.auth.getSession();


        if(error){

            throw error;

        }


        if(
            data?.session?.user
        ){

            await loadUser(
                data.session.user
            );

        }

    }
    catch(error){

        console.error(
            "SESSION ERROR:",
            error
        );

    }
}
